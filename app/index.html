<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frizzle</title>
    <!-- Hold the first paint until the masthead below has been read. -->
    <link rel="expect" href="#root" blocking="render" />
    <!-- The hand-over from the site. A cross-document view transition is
         styled by the page being entered, and must be opted into before its
         first paint, so these rules are here and not in the stylesheet the
         build links. The site's banner (named in web/assets/site.css) zooms
         toward the lit pane and fades as the ivory gives way to the night. A
         browser without the feature, or a person who asks for less motion,
         gets an ordinary page load. -->
    <style>
      html {
        background: #0d1422;
      }
      @media (prefers-reduced-motion: no-preference) {
        @view-transition {
          navigation: auto;
        }
        ::view-transition-group(masthead) {
          z-index: 3;
        }
        ::view-transition-group(banner) {
          z-index: 2;
          animation: none;
        }
        ::view-transition-old(banner) {
          transform-origin: 47% 40%;
          animation: into-the-pane 950ms cubic-bezier(0.5, 0, 0.75, 0) both;
        }
        ::view-transition-old(root) {
          animation: day-leaves 350ms ease both;
        }
        ::view-transition-new(root) {
          animation: night-arrives 450ms ease 500ms both;
        }
      }
      @keyframes into-the-pane {
        55% {
          opacity: 1;
        }
        to {
          opacity: 0;
          transform: scale(4.2);
        }
      }
      @keyframes day-leaves {
        to {
          opacity: 0;
        }
      }
      @keyframes night-arrives {
        from {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <!-- The family masthead, the site's (web/layouts/_default/baseof.html), in
         the page itself so it is there for the hand-over's first frame. -->
    <header class="family-masthead">
      <div class="family-mast">
        <a class="family-brand" href="../">Frizzle</a>
        <nav aria-label="Site">
          <a href="../">Home</a>
          <a href="../tutorial/">Tutorial</a>
          <a href="../about/">About</a>
          <a href="./" aria-current="page">Open Frizzle</a>
          <a href="https://github.com/plainsight-systems/frizzle">GitHub</a>
        </nav>
      </div>
    </header>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
